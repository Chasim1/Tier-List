<!DOCTYPE html>
<html>
<head>
  <title>Tier List</title>

  <script src="tiers.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Main container for the tier list title and tiers -->
<div class="container">


    <!-- Page title -->
  <h1 class="title">Tier List</h1>

   <!-- Button to reset all images back to the bottom pool -->
  <button id="reset">Reset</button>

    <!-- Container holding all tier rows (S–E) -->
  <div class="tier-container">


    <div class="tier-row">
      <div class="tier-label s-tier">S</div>

       <!-- Drop zone for images in S tier -->
      <!-- ondrop: runs when an image is dropped here -->
      <!-- ondragover: allows dropping (prevents default browser blocking) -->
      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

    <div class="tier-row">
      <div class="tier-label a-tier">A</div>

      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

    <div class="tier-row">
      <div class="tier-label b-tier">B</div>

      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

    <div class="tier-row">
      <div class="tier-label c-tier">C</div>

      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

    <div class="tier-row">
      <div class="tier-label d-tier">D</div>

      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

    <div class="tier-row">
      <div class="tier-label e-tier">E</div>

      <div class="tier-items"
           ondrop="drop(event)"
           ondragover="allowDrop(event)">
        <img src="https://placehold.co/100x100" />
      </div>
    </div>

  </div>
</div>

<!-- Bottom image pool -->
<div class="image-pool"
     ondrop="drop(event)"
     ondragover="allowDrop(event)">

  <img src="https://placehold.co/100x100" />
  <img src="https://placehold.co/100x100" />

</div>

</body>
</html>
